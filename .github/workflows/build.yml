name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true

      - name: Download AI models into assets
        run: |
          mkdir -p app/src/main/assets
          curl -sL -o app/src/main/assets/selfie_segmenter.tflite \
            "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite"
          curl -sL -o app/src/main/assets/squeezenet1.0-9.onnx \
            "https://github.com/onnx/models/raw/main/validated/vision/classification/squeezenet/model/squeezenet1.0-9.onnx"
          curl -sL -o app/src/main/assets/imagenet_labels.txt \
            "https://storage.googleapis.com/download.tensorflow.org/data/ImageNetLabels.txt"
          ls -la app/src/main/assets/

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIComposeCamera-APK
          path: app/build/outputs/apk/release/*.apk
